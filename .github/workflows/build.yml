name: Build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release a criar (ex.: v1.0.0). Vazio = apenas build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/Spotiwake/Spotiwake.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtraction=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotiwake-win-x64
          path: publish/Spotiwake.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Spotiwake ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: publish/Spotiwake.exe
